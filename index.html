<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Test Page</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #667eea, #764ba2);
      font-family: Arial, sans-serif;
      color: #fff;
    }

    .card {
      background: rgba(255, 255, 255, 0.15);
      padding: 2rem 3rem;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    }

    h1 {
      margin-bottom: 0.5rem;
    }

    p {
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Jenkins Deployment</h1>
    <p>This page is hosted by Jenkins Automations.</p>
  </div>
</body>
</html>
